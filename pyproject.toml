[project]
name = "skillsmcp"
version = "0.2.0"
description = "MCP server that exposes Agent Skills to AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "David Irvine" },
]
dependencies = [
    "fastmcp>=3.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
skillsmcp = "skillsmcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skillsmcp"]
